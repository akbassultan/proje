<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>İlk Git Projem</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(120deg, #6a11cb, #2575fc);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .card {
      background: rgba(255,255,255,0.15);
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      backdrop-filter: blur(6px);
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #ddd;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Git & GitHub Öğreniyorum 🚀</h1>
    <p>Bu sayfa Git ile versiyonlanıyor.</p>
    <button onclick="alert('Commit atmadan push yok 😄')">
      Tıkla
    </button>
  </div>

</body>
</html>
