<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>İlk Git Projem</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(120deg, #6a11cb, #2575fc);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .card {
      background: rgba(255,255,255,0.15);
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      backdrop-filter: blur(6px);
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #ddd;
    }
    .card {
  width: 320px;
  margin: 100px auto;
  padding: 24px;
  border-radius: 12px;
  background-color: #ffffff;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  text-align: center;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.card:hover {
  transform: translateY(-8px);
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
}

.card-title {
  margin-bottom: 12px;
  font-size: 22px;
}

.card-text {
  font-size: 15px;
  margin-bottom: 20px;
  color: #555;
}

.card-button {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  background-color: #fc997c;
  color: white;
  cursor: pointer;
}

  </style>
</head>
<body>
<div class="card">
  <h2 class="card-title">Hoş Geldin</h2>
  <p class="card-text">
    Bu kart component mantığını öğrenmek için oluşturuldu.
  </p>
  <button class="card-button">Devam Et</button>
</div>

</body>
</html>
