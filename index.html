<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Benim İlk GitHub Projem</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .kutu {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2c3e50;
        }

        p {
            color: #555;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="kutu">
        <h1>Merhaba 👋</h1>
        <p>Bu benim Git & GitHub ile yaptığım ilk web sayfası.</p>
        <button onclick="alert('GitHub öğreniyorum 🚀')">
            Tıkla
        </button>
    </div>

</body>
</html>
